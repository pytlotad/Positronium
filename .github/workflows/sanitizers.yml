name: Sanitizers

on:
  push:
    paths-ignore:
      # Documentation and generated output cannot change what the code
      # computes, so they do not earn a pair matrix, a sanitizer run or an
      # hour of CI.  Anything that CAN change a result -- sources, headers,
      # Makefile, workflows, tools -- is not listed here and still triggers
      # everything.
      - '**.md'
      - 'README.ap'
      - 'PRISM_INSTRUCTIONS.md'
      - 'distributions/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      # Documentation and generated output cannot change what the code
      # computes, so they do not earn a pair matrix, a sanitizer run or an
      # hour of CI.  Anything that CAN change a result -- sources, headers,
      # Makefile, workflows, tools -- is not listed here and still triggers
      # everything.
      - '**.md'
      - 'README.ap'
      - 'PRISM_INSTRUCTIONS.md'
      - 'distributions/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  address:
    name: ASan + LeakSanitizer
    runs-on: ubuntu-latest
    container: rootproject/root:6.34.00-ubuntu24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate memory safety in validator and production paths
        run: make asan-check SANITIZER_CXX=g++

  undefined-behavior:
    name: UBSan
    runs-on: ubuntu-latest
    container: rootproject/root:6.34.00-ubuntu24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate undefined behavior in validator and production paths
        run: make ubsan-check SANITIZER_CXX=g++
