name: Pair matrix

on:
  push:
    paths-ignore:
      # Documentation and generated output cannot change what the code
      # computes, so they do not earn a pair matrix, a sanitizer run or an
      # hour of CI.  Anything that CAN change a result -- sources, headers,
      # Makefile, workflows, tools -- is not listed here and still triggers
      # everything.
      - '**.md'
      - 'README.ap'
      - 'PRISM_INSTRUCTIONS.md'
      - 'distributions/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      # Documentation and generated output cannot change what the code
      # computes, so they do not earn a pair matrix, a sanitizer run or an
      # hour of CI.  Anything that CAN change a result -- sources, headers,
      # Makefile, workflows, tools -- is not listed here and still triggers
      # everything.
      - '**.md'
      - 'README.ap'
      - 'PRISM_INSTRUCTIONS.md'
      - 'distributions/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pair-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every modules/*.hpp must still compile on its own.  Cheap (syntax-only,
  # seconds) and it catches the regression the pair matrix cannot see: a header
  # that works only because positronium.cpp included something before it.
  header-isolation:
    name: header isolation
    runs-on: ubuntu-latest
    container: rootproject/root:6.34.00-ubuntu24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile every module header standalone
        run: make header-isolation-check

  validator:
    name: validator (${{ matrix.pair }})
    runs-on: ubuntu-latest
    container: rootproject/root:6.34.00-ubuntu24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pair:
          - electron,positron
          - electron,antimuon
          - electron,proton
          - muon,positron
          - muon,antimuon
          - muon,proton
          - antiproton,positron
          - antiproton,antimuon
          - antiproton,proton
    steps:
      - uses: actions/checkout@v4
      - name: Build and run numerical validator
        run: make validation-pair PAIR="${{ matrix.pair }}"

  production-smoke:
    name: production (${{ matrix.pair }})
    runs-on: ubuntu-latest
    container: rootproject/root:6.34.00-ubuntu24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pair:
          - electron,positron
          - electron,antimuon
          - electron,proton
          - muon,positron
          - muon,antimuon
          - muon,proton
          - antiproton,positron
          - antiproton,antimuon
          - antiproton,proton
    steps:
      - uses: actions/checkout@v4
      - name: Build and run production trajectory
        run: make production-pair-smoke PAIR="${{ matrix.pair }}"
